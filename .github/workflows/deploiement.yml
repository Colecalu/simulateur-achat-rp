# ===========================================================================
#  Déploiement d'Æquo : à chaque fusion sur main, tests puis envoi SFTP de
#  frontend/ vers l'hébergement OVH mutualisé. Voir CLAUDE.md §6 et §13.
#
#  Seul frontend/ part : outils/, tests/, docs/ et backend/ restent dans le
#  dépôt. backend/config.php n'est JAMAIS déployé par ce workflow.
#
#  Tant que les secrets FTP ne sont pas renseignés (Settings → Secrets and
#  variables → Actions), le job s'arrête proprement, sans rien envoyer : une
#  fusion sur main ne doit pas échouer parce que l'hébergement n'existe pas
#  encore. Les secrets gardent leur nom FTP_* : ce sont les identifiants du
#  compte FTP d'OVH, que SFTP utilise tels quels.
# ===========================================================================
name: Déploiement

on:
  push:
    branches: [main]
  # Lancement à la main depuis l'onglet Actions. « essai » simule l'envoi
  # sans rien écrire : à utiliser pour le tout premier déploiement.
  workflow_dispatch:
    inputs:
      essai:
        description: "Simuler seulement (liste ce qui serait envoyé ou supprimé, sans rien modifier)"
        type: boolean
        default: true

# Deux fusions rapprochées ne doivent pas envoyer en même temps : la seconde
# attend la première.
concurrency:
  group: deploiement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 (LTS), comme en local. PAS en dessous de 22 : c'est à
          # partir de Node 21 que `node --test` développe lui-même un motif
          # comme "tests/*.test.mjs". Node 20 le prenait pour un nom de
          # fichier, ne trouvait rien et sortait en erreur — tests rouges
          # sans qu'un seul test ait tourné.
          node-version: 24
      # Les tests sont l'arbitre (CLAUDE.md §0) : rouges, rien ne part.
      - run: node --test "tests/*.test.mjs"

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Les identifiants FTP sont-ils renseignés ?
        id: secrets
        env:
          SERVEUR: ${{ secrets.FTP_SERVEUR }}
          UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          MOT_DE_PASSE: ${{ secrets.FTP_MOT_DE_PASSE }}
        run: |
          if [ -z "$SERVEUR" ] || [ -z "$UTILISATEUR" ] || [ -z "$MOT_DE_PASSE" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets FTP absents : rien n'est déployé. Voir CLAUDE.md §6."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.pret == 'oui'

      # lftp plutôt qu'une action tierce : l'offre gratuite d'OVH refuse le
      # FTPS (« 500 This security scheme is not implemented ») et
      # SamKirkland/FTP-Deploy-Action ne parle pas SFTP. lftp est un outil
      # maintenu, empaqueté par Ubuntu : aucun code tiers ne voit le mot de
      # passe.
      - name: Installer lftp
        if: steps.secrets.outputs.pret == 'oui'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # La clé d'hôte est ÉPINGLÉE, pas découverte à chaque passage : un
      # ssh-keyscan dans le job accepterait n'importe quel serveur qui se
      # ferait passer pour OVH, et lui donnerait le mot de passe. Relevées le
      # 08/10/2026 sur ftp.cluster129.hosting.ovh.net (OpenSSH 7.9) :
      #   ED25519 SHA256:xhieLplnoEvvl7+a8sq8wLCh/bvOQvQFIVewi+fK2og
      #   RSA     SHA256:itDZ6cuojUbG3+jrh5F/igkXa2xjzejbYJkNAlw8/VM
      # Si OVH change de clé ou de cluster, le job échoue net (« Host key
      # verification failed ») au lieu d'envoyer à l'aveugle : relever les
      # nouvelles clés et les remplacer ici (procédure : CLAUDE.md §13).
      - name: Clé d'hôte du serveur SFTP
        if: steps.secrets.outputs.pret == 'oui'
        env:
          SERVEUR: ${{ secrets.FTP_SERVEUR }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          {
            echo "$SERVEUR ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHzGPnvg+XUpaMELjQ4AIj/6pkjvvHYCUxDVpcdaC8T"
            echo "$SERVEUR ssh-rsa "
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Envoi SFTP de frontend/
        if: steps.secrets.outputs.pret == 'oui'
        env:
          SERVEUR: ${{ secrets.FTP_SERVEUR }}
          UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          # lftp lit le mot de passe dans cette variable (open --env-password) :
          # il n'apparaît ni dans la ligne de commande, ni dans le script, ni
          # dans le journal (GitHub masque en plus tout secret affiché).
          LFTP_PASSWORD: ${{ secrets.FTP_MOT_DE_PASSE }}
          DOSSIER: ${{ secrets.FTP_DOSSIER }}
          ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.essai }}
        run: |
          set -euo pipefail

          # Un envoi réel ne part que de main : le déploiement, c'est la
          # fusion (CLAUDE.md §6). Depuis une autre branche, simulation forcée.
          if [ "$ESSAI" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Branche ${GITHUB_REF#refs/heads/} : envoi réel réservé à main, simulation forcée."
            ESSAI=true
          fi

          # Le dossier cible, relatif au home du compte. Garde-fou avant
          # --delete : un dossier vide, « . », absolu ou contenant « .. »
          # ferait supprimer ce qui se trouve HORS de la racine web.
          DOSSIER="${DOSSIER:-www}"
          DOSSIER="${DOSSIER#./}"
          DOSSIER="${DOSSIER%/}"
          case "$DOSSIER" in
            ""|"."|/*|*..*)
              echo "::error::FTP_DOSSIER refusé (« $DOSSIER ») : il faut un dossier relatif au home, comme www."
              exit 1 ;;
          esac

          # --reverse : du dépôt vers le serveur. --delete : ce qui n'existe
          # plus dans frontend/ disparaît du serveur (dont la page « Site en
          # construction » d'OVH), mais seulement SOUS le dossier cible : lftp
          # y entre d'abord (cd), et s'arrête s'il n'existe pas.
          # --overwrite : un fichier modifié est réécrit en place. Sans lui,
          # lftp SUPPRIME d'abord l'ancien : index.html manquerait le temps
          # de l'envoi.
          # --no-perms : les droits du serveur restent ceux d'OVH.
          # .ovhconfig : réglage PHP d'OVH, s'il était posé dans www/ ; ni
          # envoyé ni supprimé.
          OPTIONS="--reverse --delete --overwrite --verbose --no-perms --parallel=4 --exclude-glob .ovhconfig"
          if [ "$ESSAI" = "true" ]; then
            OPTIONS="$OPTIONS --dry-run"
            echo "::notice::Simulation : liste de ce qui serait envoyé (put) ou supprimé (rm) dans $DOSSIER/, rien n'est modifié."
          fi

          # StrictHostKeyChecking=yes + known_hosts épinglé : jamais de
          # question interactive, et jamais de connexion à un serveur inconnu.
          lftp <<FIN
          set cmd:fail-exit yes
          # Avec --overwrite, lftp garde par défaut une copie de chaque fichier
          # remplacé (index.html~20261008…~) : dans www/, elle serait publique.
          set xfer:make-backup no
          # Chaque fichier part sous un nom temporaire, puis est RENOMMÉ à sa
          # place. Le 08/10/2026, le premier envoi réel a échoué sur
          # « Access failed: No such file (index.html) » : la page d'attente
          # d'OVH est un lien symbolique vers un fichier hors de notre espace,
          # qu'on ne peut pas ouvrir en écriture. Le renommage remplace le lien
          # lui-même (reproduit et vérifié en SFTP local). Bonus : un visiteur
          # ne reçoit jamais un fichier à moitié envoyé.
          set xfer:use-temp-file yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          open --env-password -u "$UTILISATEUR" "sftp://$SERVEUR:22"
          cd "$DOSSIER"
          mirror $OPTIONS ./frontend/ ./
          bye
          FIN

      # IndexNow : prévient Bing, Yandex, Seznam… (api.indexnow.org relaie à
      # tous les moteurs du protocole) que les pages du sitemap ont changé,
      # au lieu d'attendre leur prochain passage. Google n'y participe pas.
      #
      # INACTIF tant que la variable de dépôt INDEXNOW_ENABLED ne vaut pas
      # « true » (Settings → Secrets and variables → Actions → Variables). Le
      # noindex est retiré depuis le 09/10/2026 ; la variable se définit à part,
      # par décision du propriétaire (checklist, CLAUDE.md §13).
      #
      # Seulement après un envoi RÉEL depuis main : jamais en simulation.
      # La clé n'est pas un secret : le protocole exige qu'elle soit publique,
      # dans frontend/<clé>.txt, que le moteur va lire pour vérifier que
      # l'annonce vient bien du propriétaire du site. Un échec ici ne fait pas
      # échouer le déploiement, déjà fait : il apparaît en avertissement.
      - name: Signaler les pages à IndexNow
        if: >-
          steps.secrets.outputs.pret == 'oui'
          && vars.INDEXNOW_ENABLED == 'true'
          && github.ref == 'refs/heads/main'
          && !(github.event_name == 'workflow_dispatch' && inputs.essai)
        continue-on-error: true
        run: |
          set -euo pipefail
          # La clé : le seul fichier de 32 caractères hexadécimaux + .txt à la
          # racine de frontend/. Le changer = générer une nouvelle clé et
          # remplacer le fichier, rien d'autre.
          FICHIER=$(ls frontend | grep -E '^[0-9a-f]{32}\.txt$' | head -n 1 || true)
          if [ -z "$FICHIER" ]; then
            echo "::warning::Fichier de clé IndexNow introuvable dans frontend/ : rien n'est signalé."
            exit 0
          fi
          CLE="${FICHIER%.txt}"
          # Les adresses viennent du sitemap : une seule liste des pages.
          URLS=$(grep -oE '<loc>[^<]+</loc>' frontend/sitemap.xml | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          CORPS=$(jq -nc --arg cle "$CLE" --argjson urls "$URLS" \
            '{host: "aequo-immo.fr", key: $cle, keyLocation: ("https://aequo-immo.fr/" + $cle + ".txt"), urlList: $urls}')
          CODE=$(curl -sS -o reponse.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$CORPS" https://api.indexnow.org/indexnow)
          # 200 : reçu ; 202 : reçu, clé en cours de vérification.
          if [ "$CODE" = "200" ] || [ "$CODE" = "202" ]; then
            echo "::notice::IndexNow : $(echo "$URLS" | jq length) adresses signalées (HTTP $CODE)."
          else
            echo "::warning::IndexNow a répondu HTTP $CODE : $(cat reponse.txt)"
            exit 1
          fi
